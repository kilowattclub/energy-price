[package]
name = "energy-price"
version = "0.1.0"
edition = "2021"
description = "Half-hour electricity import and export prices with optional Axle rewards"
repository = "https://github.com/kilowattclub/energy-price"
readme = "README.md"
license = "MIT"
keywords = ["energy", "forecast", "electricity"]
categories = ["science"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
thiserror = "2"
log = "0.4"
